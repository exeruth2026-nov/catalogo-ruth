<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo | SOY RUTH NOVEDADES</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html { scroll-behavior: smooth; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 font-sans">

  <header class="bg-gray-900 text-white text-center p-5 md:p-6 shadow-md">
    <h1 class="text-2xl md:text-3xl font-black uppercase tracking-widest text-pink-500">SOY RUTH <span class="text-white">NOVEDADES</span></h1>
    <p class="text-xs md:text-sm mt-2 text-gray-300">Los mejores productos CALIDAD-PRECIO • Envíos a todo el país</p>
  </header>

  <main class="max-w-7xl mx-auto p-3 md:p-4 mt-4">
    
    <div class="mb-4 relative hidden" id="caja-buscador">
      <input type="text" id="buscador" placeholder="🔍 Buscar producto o marca..." 
             class="w-full p-3 md:p-4 rounded-xl border border-gray-300 focus:border-pink-500 focus:ring-2 focus:ring-pink-200 outline-none shadow-sm text-base md:text-lg transition-all">
    </div>

    <div id="cargando" class="text-center text-gray-500 font-semibold text-lg py-10 animate-pulse">
      Cargando novedades...
    </div>
    
    <div class="flex flex-col md:flex-row-reverse gap-6 hidden" id="contenido-principal">
      
      <aside class="w-full md:w-1/4 z-10 sticky top-2 md:top-6">
        <div class="bg-white p-3 md:p-5 rounded-xl shadow border border-gray-200">
          <h3 class="hidden md:block text-xl font-bold text-gray-800 mb-4 uppercase border-b-2 border-pink-500 pb-1">CATEGORÍAS</h3>
          
          <button onclick="const menu = document.getElementById('lista-categorias'); menu.classList.toggle('hidden'); menu.classList.toggle('flex');" class="md:hidden w-full flex justify-between items-center text-sm font-bold text-pink-600 uppercase border-b-2 border-pink-500 pb-2 outline-none">
            <span>📁 Filtrar por Categoría</span>
            <span>▼</span>
          </button>

          <ul id="lista-categorias" class="hidden md:flex flex-col gap-2 text-sm font-semibold text-gray-600 mt-3 md:mt-0 max-h-64 overflow-y-auto md:max-h-full scrollbar-hide">
          </ul>
        </div>
      </aside>

      <div class="w-full md:w-3/4">
        <div id="contenedor-catalogo"></div>
      </div>
      
    </div>
  </main>

  <script>
    let todosLosProductos = []; 
    
    // 🔴 PEGA TU URL DE APPS SCRIPT AQUÍ 🔴
    const urlAPI = 'https://script.google.com/macros/s/AKfycbwMDuluV49m9ThpcdHDYt-bto_WhoqSJrJ3ZNd-0qrkhHTWG7ZX-9K4KikyjK-YSaDh/exec';

    // Ahora hacemos un "fetch" para traer los datos desde afuera
    fetch(urlAPI)
      .then(response => response.json())
      .then(data => iniciarCatalogo(data))
      .catch(error => mostrarError(error));

    function mostrarError(error) {
      const msj = error && error.message ? error.message : "Error desconocido de conexión.";
      document.getElementById('cargando').innerHTML = "❌ ERROR: " + msj;
      document.getElementById('cargando').className = "text-center text-red-600 font-bold text-xl py-10";
    }

    function iniciarCatalogo(productos) {
      if (productos.error) {
        mostrarError({ message: productos.error });
        return;
      }
      try {
        document.getElementById('cargando').style.display = 'none';
        document.getElementById('contenido-principal').classList.remove('hidden');
        document.getElementById('caja-buscador').classList.remove('hidden');
        todosLosProductos = productos;
        renderizarPantalla(todosLosProductos); 
      } catch (e) {
        mostrarError(e);
      }
    }

    document.getElementById('buscador').addEventListener('input', function(e) {
      const texto = e.target.value.toLowerCase().trim();
      if(texto === "") {
        renderizarPantalla(todosLosProductos);
        return;
      }
      const filtrados = todosLosProductos.filter(prod => {
        const pNombre = String(prod.nombre || "").toLowerCase();
        const pMarca = String(prod.marca || "").toLowerCase();
        const pDesc = String(prod.descripcion || "").toLowerCase();
        return pNombre.includes(texto) || pMarca.includes(texto) || pDesc.includes(texto);
      });
      renderizarPantalla(filtrados);
    });

    function renderizarPantalla(productosRender) {
      const contenedor = document.getElementById('contenedor-catalogo');
      const menuCategorias = document.getElementById('lista-categorias');

      if(productosRender.length === 0) {
        contenedor.innerHTML = '<div class="text-center py-10 bg-white rounded-xl shadow border border-gray-200"><p class="text-lg text-gray-600 font-bold mb-2">No encontramos coincidencias 😅</p></div>';
        menuCategorias.innerHTML = '<li class="text-center text-gray-400">Sin resultados</li>';
        return;
      }

      const catalogoAgrupado = {};
      productosRender.forEach(prod => {
        let cat = String(prod.categoria || "Otras");
        if(!catalogoAgrupado[cat]) catalogoAgrupado[cat] = { "DISPONIBLE": [], "RESERVADO": [], "VENDIDO": [] };
        let est = String(prod.estado || "DISPONIBLE");
        if(est !== "RESERVADO" && est !== "VENDIDO") est = "DISPONIBLE";
        catalogoAgrupado[cat][est].push(prod);
      });

      let htmlFinal = "";
      let htmlMenu = "";
      const categoriasOrdenadas = Object.keys(catalogoAgrupado).sort();

      categoriasOrdenadas.forEach(categoria => {
        let catId = String(categoria).replace(/[^a-zA-Z0-9]/g, "");
        
        htmlMenu += `<li>
          <a href="#${catId}" onclick="if(window.innerWidth < 768) { document.getElementById('lista-categorias').classList.add('hidden'); document.getElementById('lista-categorias').classList.remove('flex'); }" 
             class="block px-4 py-2 md:px-0 md:py-1 bg-pink-50 md:bg-transparent rounded-lg md:rounded-none hover:text-pink-600 transition-colors border border-pink-100 md:border-none w-full text-left">
            👉 ${categoria}
          </a>
        </li>`;
        
        htmlFinal += `<div id="${catId}" class="pt-2 md:pt-6"></div>`; 
        htmlFinal += `<h2 class="text-xl md:text-3xl font-black text-gray-800 mt-2 mb-4 border-b-4 border-pink-500 inline-block uppercase">${categoria}</h2>`;
        
        const ordenEstados = [
          { clave: "DISPONIBLE", color: "text-green-600", icono: "🟢" },
          { clave: "RESERVADO", color: "text-yellow-600", icono: "🟡" },
          { clave: "VENDIDO", color: "text-red-600", icono: "🔴" }
        ];

        ordenEstados.forEach(objEstado => {
          const listaProd = catalogoAgrupado[categoria][objEstado.clave];
          
          if(listaProd && listaProd.length > 0) {
            htmlFinal += `<h3 class="text-base font-bold ${objEstado.color} mb-3 mt-2 md:ml-2 border-l-4 border-current pl-2 shadow-sm bg-white inline-block pr-3 py-1 rounded">${objEstado.icono} ${objEstado.clave}S</h3>`;
            htmlFinal += `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6 mb-8">`;
            
            listaProd.forEach(prod => {
              let pNormal = parseFloat(prod.precio) || 0;
              let pOferta = parseFloat(prod.oferta) || 0;
              let htmlPrecio = "";
              let txtWspPrecio = "";
              
              if(pOferta > 0) {
                htmlPrecio = `<span class="text-red-500 line-through text-xs md:text-sm font-bold mr-2 opacity-80">$${pNormal.toLocaleString('es-AR')}</span><span class="text-green-600 font-black text-2xl md:text-3xl tracking-tight">$${pOferta.toLocaleString('es-AR')}</span>`;
                txtWspPrecio = `🔥 *OFERTA!* Precio normal $${pNormal} rebajado a *$${pOferta}*`;
              } else {
                htmlPrecio = `<span class="text-gray-900 font-black text-2xl md:text-3xl tracking-tight">$${pNormal.toLocaleString('es-AR')}</span>`;
                txtWspPrecio = `*Precio:* $${pNormal}`;
              }

              let htmlEnlaceRef = "";
              if(prod.enlaceRef && prod.enlaceRef.trim() !== "") {
                let urlLimpia = prod.enlaceRef.trim();
                if(!urlLimpia.startsWith("http")) urlLimpia = "https://" + urlLimpia;
                htmlEnlaceRef = `<a href="${urlLimpia}" target="_blank" class="inline-flex items-center text-xs md:text-sm font-semibold text-pink-600 hover:text-pink-800 bg-pink-50 px-3 py-1 rounded-full mb-3 transition-colors border border-pink-200"><span>🔗 Ver Referencia Web</span></a>`;
              }

              let opacidad = (objEstado.clave === "VENDIDO") ? "opacity-60 grayscale" : "";
              let btnWspFondo = (objEstado.clave === "DISPONIBLE") ? "bg-green-500 hover:bg-green-600" : "bg-gray-400 cursor-not-allowed pointer-events-none";
              let btnWspTexto = (objEstado.clave === "DISPONIBLE") ? "Comprar por WhatsApp" : "No Disponible";
              
              let msjWsp = encodeURIComponent(`Hola Soy Ruth Novedades 👋\nMe interesa este artículo:\n\n📦 *${prod.nombre}*\n🏷️ Marca: *${prod.marca}*\n💲 ${txtWspPrecio}`);
              let linkWsp = "https://wa.me/5493885122621?text=" + msjWsp; 

              htmlFinal += `
                <div class="bg-white rounded-xl md:rounded-2xl shadow-sm md:shadow-md overflow-hidden flex flex-col justify-between border border-gray-200 transition duration-300 hover:shadow-lg ${opacidad}">
                  <div class="h-48 md:h-56 bg-white flex items-center justify-center overflow-hidden relative border-b border-gray-100 p-2">
                    ${prod.foto ? `<img src="${prod.foto}" alt="${prod.nombre}" class="w-full h-full object-contain rounded-lg">` : `<span class="text-gray-300 font-medium text-4xl">📸</span>`}
                    <div class="absolute top-2 right-2 md:top-3 md:right-3 bg-gray-900/80 backdrop-blur-sm text-white text-[10px] md:text-xs font-bold px-2 py-1 md:px-3 md:py-1.5 rounded-full shadow border border-gray-700">📦 Stock: ${prod.stock}</div>
                  </div>
                  <div class="p-3 md:p-5 flex-grow bg-gray-50/30">
                    <p class="text-[10px] md:text-xs font-bold text-pink-700 mb-1 md:mb-2 uppercase tracking-wider bg-pink-50 inline-block px-2 py-0.5 rounded border border-pink-200 shadow-sm">${prod.marca}</p>
                    <h2 class="text-base md:text-lg font-bold text-gray-800 leading-tight mb-2">${prod.nombre}</h2>
                    <button onclick="const desc = this.nextElementSibling; desc.classList.toggle('hidden'); this.innerText = desc.classList.contains('hidden') ? '👇 Ver características' : '👆 Ocultar características';" class="text-left text-sm font-bold text-pink-600 bg-pink-50 hover:bg-pink-100 rounded-lg w-full py-1.5 px-3 mb-2 transition-colors border border-pink-100 outline-none">👇 Ver características</button>
                    <div class="hidden text-gray-600 text-xs md:text-sm mb-3 bg-white p-3 rounded-lg border border-gray-200 shadow-inner whitespace-pre-line leading-relaxed">${prod.descripcion}</div>
                    <div class="mt-2 pt-3 md:pt-4 border-t border-gray-200 flex flex-col">${htmlEnlaceRef}<div class="flex items-end">${htmlPrecio}</div></div>
                  </div>
                  <div class="bg-white p-3 md:p-4">
                    <a href="${linkWsp}" target="_blank" class="block text-center w-full ${btnWspFondo} text-white font-bold text-base md:text-lg py-2.5 md:py-3 rounded-lg md:rounded-xl shadow transition-all active:scale-95">${btnWspTexto}</a>
                  </div>
                </div>
              `;
            });
            htmlFinal += `</div>`; 
          }
        });
      });
      contenedor.innerHTML = htmlFinal;
      menuCategorias.innerHTML = htmlMenu;
    }
  </script>
</body>
</html>
